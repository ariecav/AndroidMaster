# ============================================================
#  Setelan Gradle untuk project ini (ikut masuk git)
# ============================================================
# Setelan yang khusus mesin  -- heap, jumlah worker, lokasi JDK, proxy --
# JANGAN ditulis di sini. Tempatnya di ~/.gradle/gradle.properties
# supaya tidak bikin diff git dan tidak bentrok antara PC dan HP.
# Lihat docs/TERMUX_DEBIAN_SETUP.md bagian "Setelan Gradle untuk HP".

# Heap JVM untuk Gradle daemon. 4g wajar untuk PC/WSL.
# Di HP (Termux) turunkan jadi 1g-2g lewat ~/.gradle/gradle.properties.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache dimatikan: gagal diam-diam untuk project yang ada di
# /mnt/* (drvfs) saat dibangun dari WSL. Boleh dinyalakan di HP kalau mau.
org.gradle.configuration-cache=false

org.gradle.workers.max=4

kotlin.code.style=official

# Kompilasi Kotlin di dalam proses Gradle, bukan lewat compile daemon
# terpisah. Mencegah "Could not connect to Kotlin compile daemon" dan jauh
# lebih hemat memori -- penting di HP.
kotlin.compiler.execution.strategy=in-process

# Kelas R tiap library hanya memuat resource miliknya sendiri.
android.nonTransitiveRClass=true
